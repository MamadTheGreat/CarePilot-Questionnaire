services:
  - type: web
    name: carepilot-questionnaire
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/questionnaires
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SURVEY_ADMIN_KEY
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false

